<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sistema de selección y combinación de listas de asistencia"
  >

  <title>Impresión de Listas</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <header class="top-header">

    <div class="header-content">

      <div class="brand">

        <div class="brand-icon">
          📋
        </div>

        <div>
          <h1>Impresión de Listas</h1>

          <p>
            Seleccione las cátedras que desea imprimir
          </p>
        </div>

      </div>

    </div>

  </header>


  <main class="main-container">


    <!-- =========================================
         PANEL DE CONTROLES
         ========================================= -->

    <section class="control-panel">

      <div class="control-left">

        <button
          type="button"
          id="select-all"
          class="control-button"
        >
          ☑ Seleccionar todo
        </button>

        <button
          type="button"
          id="deselect-all"
          class="control-button secondary"
        >
          ☐ Deseleccionar todo
        </button>

      </div>


      <div class="selection-counter">

        <strong id="selection-count">
          0
        </strong>

        <span>
          listas seleccionadas
        </span>

      </div>

    </section>


    <!-- =========================================
         LISTAS
         ========================================= -->

    <section
      id="lists-container"
      class="lists-container"
      aria-live="polite"
      aria-busy="true"
    >

      <div class="loading-state">

        <div class="loading-spinner"></div>

        <span>
          Cargando listas...
        </span>

      </div>

    </section>


    <!-- =========================================
         BOTÓN COMBINAR
         ========================================= -->

    <section class="combine-section">

      <button
        type="button"
        id="combine-button"
        class="combine-button"
      >
        📄 GENERAR PDF
      </button>

    </section>


    <!-- =========================================
         ESTADO
         ========================================= -->

    <section class="status-panel">

      <div
        id="status-icon"
        class="status-icon"
      >
        i
      </div>

      <div class="status-content">

        <div
          id="status-message"
          class="status-message"
        >
          Seleccione las listas que desea combinar.
        </div>

        <div class="progress-container">

          <div
            id="progress-bar"
            class="progress-bar"
          ></div>

        </div>

      </div>

    </section>


    <!-- =========================================
         RESULTADO
         ========================================= -->

    <section
      id="result-panel"
      class="result-panel"
      hidden
    >

      <div class="result-icon">
        ✓
      </div>

      <div class="result-content">

        <h2>
          PDF generado correctamente
        </h2>

        <p id="result-detail">
          Se combinaron las listas seleccionadas.
        </p>

        <div class="result-buttons">

          <button
            type="button"
            id="open-pdf"
            class="result-button"
          >
            👁 Ver PDF
          </button>

          <button
            type="button"
            id="print-pdf"
            class="result-button print"
          >
            🖨 Imprimir
          </button>

        </div>

      </div>

    </section>


  </main>


  <footer class="footer">

    <p>
      Sistema de impresión de listas de asistencia
    </p>

  </footer>


  <script src="app.js"></script>

</body>

</html>
